name: Scaffold checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check layout, records, links and original course files
        run: python scripts/check_scaffold.py
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/run/requirements.txt
            pyproject.toml
      - name: Install CPU analysis dependencies
        run: python -m pip install -e ".[exr]" -r scripts/run/requirements.txt
      - name: Run portable unit and fixture regressions
        run: python -B scripts/check_tests.py --suite cpu
